[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3d-worker"
version = "0.1.0"
description = "model3d-studio 파이프라인 워커"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "ezdxf>=1.3",
    "PyMuPDF>=1.24",
    "trimesh>=4.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

# 선택 의존성 — 설치 실패해도 M0 는 통과한다 (설계서 §6-1)
[project.optional-dependencies]
geom = ["manifold3d>=2.5"]
agents = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8.2"]

[project.scripts]
m3d = "m3d.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
